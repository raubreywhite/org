url: https://www.rwhite.no/org/

template:
  package: rwtemplate
  params:
    hero:
      overline: "R package · Project structure"
      title: "Organise projects: code, results, data."
      lede: >
        A standardised project layout with consistent cross-platform paths,
        date-organised results, and safe file handling — so every analysis is
        laid out <em>the same way</em>.
      cta:
        primary:
          text: "Get started"
          href: "articles/org.html"
        secondary:
          text: "Browse the reference →"
          href: "reference/index.html"

reference:
- title: "Package and Environment"
  contents:
    - initialize_project
    - project
    - set_results

- title: "File and Directory Utilities"
  contents:
    - loc_per_file
    - ls_files
    - move_directory
    - path
    - write_text

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  before: "This package is proudly brought to you by:"
  after: "See the [changelog](news/index.html) for other contributors. :pray:"
  Richard Aubrey White:
    href: "https://www.rwhite.no"
