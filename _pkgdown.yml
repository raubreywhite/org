url: https://www.rwhite.no/org/

template:
  bootstrap: 5
  bslib:
    heading_font: { google: "Newsreader" }
    code_font:    { google: "IBM Plex Mono" }
    primary: "#8a1c1c"
    bg: "#ffffff"
    fg: "#231c16"
    link-color: "#8a1c1c"
    border-radius: "0.15rem"
  includes:
    in_header: >
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

navbar:
  bg: dark
  type: dark
  structure:
    left:  [reference, articles]
    right: [search, github]

reference:
- title: "Package and Environment"
  contents:
    - initialize_project
    - project
    - set_results

- title: "File and Directory Utilities"
  contents:
    - ls_files
    - move_directory
    - path
    - write_text

footer:
  structure:
    #left: csids
    right: developed_by
  components:
    #csids: <a href='https://www.csids.no'><img src='https://www.csids.no/resources/logo/logo_full_blue.svg' width=200></a>

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  before: "This package is proudly brought to you by:"
  after: "See the [changelog](news/index.html) for other contributors. :pray:"
  Richard Aubrey White:
    href: "https://www.rwhite.no"
